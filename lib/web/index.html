<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmO Agent Config</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header class="app-header">
            <div class="logo">
                <h1>OmO Agent Config</h1>
            </div>

            <div class="profile-selector">
                <select id="profile-select">
                    <option value="">Loading profiles...</option>
                </select>
                <button id="manage-profiles-btn" class="btn btn-secondary" title="Manage profiles">⚙️</button>
                <button id="provider-policies-btn" class="btn btn-secondary" title="Configure provider policies">📊 Policies</button>
            </div>
            <div class="actions">
                <button id="undo-btn" class="btn btn-text" disabled>\u21a9\ufe0f Undo</button>
                <button id="save-btn" class="btn btn-primary" disabled>\ud83d\udcbe Save Changes</button>
            </div>
        </header>

        <main class="app-main">
            <div class="status-bar" id="status-bar">
                <span class="loading">Loading...</span>
            </div>

            <div class="agents-grid" id="agents-grid">
                <!-- Agents will be rendered here -->
            </div>
        </main>

        <footer class="app-footer">
            <div class="footer-right">
                <span id="last-updated">Never updated</span>
            </div>
        </footer>
    </div>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Title</h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Modal content -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
